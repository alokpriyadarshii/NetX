<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetX Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --ink: #17202a;
      --muted: #617084;
      --panel: #ffffff;
      --line: #d9e0ea;
      --accent: #0f766e;
      --accent-dark: #0b5e58;
      --warn: #b45309;
      --bad: #b91c1c;
      --good: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, #eef3f8 0%, var(--bg) 38%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 760;
    }

    .subtle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .status-pill {
      min-width: 168px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }

    .status-pill.good {
      color: var(--good);
      border-color: #b9dec5;
      background: #eefbf2;
    }

    .status-pill.bad {
      color: var(--bad);
      border-color: #f0b9b9;
      background: #fff0f0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr;
      gap: 14px;
      margin: 22px 0;
    }

    .metric,
    .resolver {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(28, 39, 49, 0.06);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .resolver {
      grid-column: 1 / -1;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 116px 112px;
      gap: 10px;
      margin-top: 14px;
    }

    input,
    select,
    button {
      height: 44px;
      border-radius: 6px;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fbfdff;
      color: var(--ink);
      padding: 0 12px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 760;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: var(--accent-dark);
    }

    .result {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      overflow: hidden;
    }

    .result-row {
      display: grid;
      grid-template-columns: 100px 1fr 96px;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      align-items: center;
    }

    .result-row:first-child {
      border-top: 0;
    }

    .answer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .message {
      margin-top: 14px;
      color: var(--muted);
      min-height: 22px;
    }

    .message.error {
      color: var(--bad);
    }

    @media (max-width: 760px) {
      header,
      .grid,
      form,
      .result-row {
        grid-template-columns: 1fr;
      }

      header {
        align-items: stretch;
      }

      h1 {
        font-size: 28px;
      }

      .status-pill {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NetX Dashboard</h1>
        <p class="subtle">Live DNS over HTTPS check through your local NetX listener.</p>
      </div>
      <div id="statusPill" class="status-pill">Checking</div>
    </header>

    <section class="grid" aria-label="NetX status">
      <article class="metric">
        <div class="label">Listener</div>
        <div id="listener" class="value">127.0.0.1:5053</div>
      </article>
      <article class="metric">
        <div class="label">Latency</div>
        <div id="latency" class="value">-- ms</div>
      </article>
      <article class="metric">
        <div class="label">Last Check</div>
        <div id="lastCheck" class="value">Pending</div>
      </article>

      <article class="resolver">
        <div class="label">Resolve Through NetX</div>
        <form id="lookupForm">
          <input id="domain" name="domain" value="openai.com" autocomplete="off" spellcheck="false" aria-label="Domain">
          <select id="recordType" aria-label="Record type">
            <option>A</option>
            <option>AAAA</option>
          </select>
          <button type="submit">Resolve</button>
        </form>
        <div id="message" class="message"></div>
        <div id="results" class="result" hidden></div>
      </article>
    </section>
  </main>

  <script>
    const statusPill = document.querySelector("#statusPill");
    const listener = document.querySelector("#listener");
    const latency = document.querySelector("#latency");
    const lastCheck = document.querySelector("#lastCheck");
    const form = document.querySelector("#lookupForm");
    const domain = document.querySelector("#domain");
    const recordType = document.querySelector("#recordType");
    const message = document.querySelector("#message");
    const results = document.querySelector("#results");

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function renderAnswers(payload) {
      results.innerHTML = "";
      const answers = payload.answers || [];
      if (!answers.length) {
        results.hidden = true;
        setMessage("NetX responded, but there were no answer records.", false);
        return;
      }

      for (const answer of answers) {
        const row = document.createElement("div");
        row.className = "result-row";
        row.innerHTML = `
          <div>${answer.type}</div>
          <div class="answer">${answer.value}</div>
          <div>${answer.ttl}s TTL</div>
        `;
        results.appendChild(row);
      }
      results.hidden = false;
      setMessage(`Resolved ${payload.name || domain.value} in ${payload.latencyMs} ms.`);
    }

    async function updateStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const payload = await response.json();
        listener.textContent = payload.netx || "127.0.0.1:5053";
        latency.textContent = payload.latencyMs ? `${payload.latencyMs} ms` : "-- ms";
        lastCheck.textContent = new Date().toLocaleTimeString();
        statusPill.textContent = payload.running ? "Running" : "Offline";
        statusPill.className = `status-pill ${payload.running ? "good" : "bad"}`;
      } catch {
        statusPill.textContent = "Offline";
        statusPill.className = "status-pill bad";
        latency.textContent = "-- ms";
        lastCheck.textContent = new Date().toLocaleTimeString();
      }
    }

    async function resolveDomain(event) {
      event.preventDefault();
      setMessage("Resolving through NetX...");
      results.hidden = true;
      try {
        const params = new URLSearchParams({ name: domain.value.trim(), type: recordType.value });
        const response = await fetch(`/api/resolve?${params}`, { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok || payload.error) {
          throw new Error(payload.error || "Lookup failed.");
        }
        renderAnswers(payload);
        updateStatus();
      } catch (error) {
        setMessage(error.message, true);
      }
    }

    form.addEventListener("submit", resolveDomain);
    updateStatus();
    resolveDomain(new Event("submit"));
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
